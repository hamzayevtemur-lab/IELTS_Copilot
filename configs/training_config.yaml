# QLoRA Fine-Tuning Configuration
training:
  output_dir: "checkpoints/qwen_ielts_copilot"
  epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  logging_steps: 25
  eval_steps: 200
  save_steps: 200
  max_length: 512
  gradient_checkpointing: true

qlora:
  use_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    fast: ["q_proj", "v_proj"]
    comprehensive: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  active_targets: "fast"
